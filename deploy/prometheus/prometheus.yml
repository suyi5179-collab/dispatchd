global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8850"]}]
  - job_name: worker # every replica (docker-compose up --scale worker=2)
    dns_sd_configs: [{names: ["worker"], type: A, port: 8853, refresh_interval: 10s}]
