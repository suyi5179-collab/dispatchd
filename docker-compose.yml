# dispatchd: API (+ outbox relay), worker, fake email/push providers,
# MySQL and Kafka (KRaft, single node).
# Host ports: API 8850, email 8851, push 8852, worker 8853, MySQL 33518,
# Kafka 19193.
name: dispatchd

x-go: &go
  image: dispatchd:dev
  pull_policy: never # built once by the api service below
  restart: unless-stopped
  mem_limit: 96m

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dispatchd-root # local demo database, not a secret
      MYSQL_DATABASE: dispatchd
      MYSQL_USER: dispatchd
      MYSQL_PASSWORD: dispatchd # local demo database, not a secret
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--skip-name-resolve", "--max-connections=200", "--innodb-log-buffer-size=8M"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["33518:3306"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udispatchd -pdispatchd --silent"]
      interval: 2s
      retries: 60

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19193
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19193
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ["19193:19193"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      retries: 60

  email:
    <<: *go
    command: ["fakeprovider", "-kind", "email", "-addr", ":8851"]
    ports: ["8851:8851"]

  push:
    <<: *go
    command: ["fakeprovider", "-kind", "push", "-addr", ":8852"]
    ports: ["8852:8852"]

  api:
    <<: *go
    build: .
    command: ["api"]
    environment:
      DISPATCHD_MYSQL_DSN: dispatchd:dispatchd@tcp(mysql:3306)/dispatchd
      DISPATCHD_KAFKA_BROKERS: kafka:9092
      DISPATCHD_API_KEYS: ${DISPATCHD_API_KEYS:-demo:dk_demo_local_only:admin}
    ports: ["8850:8850"]
    depends_on: {mysql: {condition: service_healthy}, kafka: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8850/healthz >/dev/null"]
      interval: 2s
      retries: 60

  worker:
    <<: *go
    command: ["worker"]
    environment:
      DISPATCHD_MYSQL_DSN: dispatchd:dispatchd@tcp(mysql:3306)/dispatchd
      DISPATCHD_KAFKA_BROKERS: kafka:9092
      DISPATCHD_EMAIL_URL: http://email:8851
      DISPATCHD_PUSH_URL: http://push:8852
      DISPATCHD_WORKER_NAME: worker-1
    ports: ["8853:8853"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8853/healthz >/dev/null"]
      interval: 2s
      retries: 60

volumes:
  mysql-data:
  kafka-data:
