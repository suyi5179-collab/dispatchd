name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.27.4"}
      - name: MySQL 8.4 and Kafka 3.9.1 (same images and settings as local)
        run: docker compose -p dispatchd up -d --wait mysql kafka
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: tests (rate limits, outages, duplicates, worker kill/restart)
        run: go test -race -count=1 -timeout 15m ./...
      - name: the three protections must each be load-bearing
        run: ./scripts/contrasts.sh
      - name: alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: node scripts/check_anchors.mjs
      - run: node video/check_narration.mjs
      - run: node scripts/build_problem_videos.mjs > /dev/null
      - run: cd frontend && npm ci && npm run build
      - run: docker compose config -q
  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npm ci
      - run: DC="docker compose" ./scripts/demo.sh
      - run: DC="docker compose" ./scripts/e2e.sh
